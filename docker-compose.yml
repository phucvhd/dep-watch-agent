services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dep_watch
      POSTGRES_PASSWORD: dep_watch
      POSTGRES_DB: dep_watch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dep_watch -d dep_watch"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
