[project]
name = "dep-watch-agent"
version = "0.1.0"
description = "Agent that watches project dependencies for releases, advisories, and breaking changes"
authors = [
    { name = "SteveVu", email = "phucvhd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dep-watch-agent = "dep_watch_agent.cli:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
